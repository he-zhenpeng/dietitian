name: Build and Push Docker Image

# 触发条件：当向 main 分支推送代码时触发
on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    # 1. 检出仓库代码
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. 设置 Docker Buildx（现代打包引擎，支持多平台和缓存优化）
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 3. 登录到 Docker Hub（自动读取刚刚配置的 Secrets）
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # 4. 构建并推送镜像
    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: true
        # 标签：每次打包会同时生成最新版(latest)和带版本号(Git Commit SHA)的版本
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/dietitian:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/dietitian:${{ github.sha }}
